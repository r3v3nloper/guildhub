## guildhub.subdomain.conf
## Copy to <swag-config>/nginx/proxy-confs/ and run `docker restart swag`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name guildhub.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 10m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app guildhub;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Never cache the service worker and manifest for long, otherwise PWA updates never arrive.
    location ~ ^/(serwist/sw\.js|manifest\.webmanifest)$ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app guildhub;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
